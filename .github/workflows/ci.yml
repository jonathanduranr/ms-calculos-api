# ==============================================================================
# PIPELINE DE INTEGRACIÓN Y ENTREGA CONTINUA (CI/CD) - DUOC UC
# Asignatura: Introducción a Herramientas DevOps (ISY1101)
# ==============================================================================

name: Pipeline CI/CD - Flujo Profesional

# 1. EVENTOS DESENCADENANTES (TRIGGERS)
# - pull_request: Valida el código antes de mezclarlo (Solo CI)
# - push a main:  Valida, empaqueta en Docker, verifica salud y genera artefacto (CI + CD)
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  # ============================================================================
  # ETAPA 1: INTEGRACIÓN CONTINUA (CI)
  # Se ejecuta tanto en el Pull Request como al hacer Merge (push) a main.
  # ============================================================================
  integracion-continua:
    name: 1. CI - Pruebas Unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v7

      - name: Configurar entorno Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Ejecutar pruebas unitarias automatizadas
        run: npm test

  # ============================================================================
  # ETAPA 2: ENTREGA CONTINUA (CD)
  # Depende de que CI pase (needs) y SOLO corre al hacer Merge/Push a main.
  # ============================================================================
  entrega-continua:
    name: 2. CD - Imagen Docker y Despliegue
    needs: integracion-continua
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v7

      - name: Configurar entorno Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Compilar aplicacion (dist/)
        run: npm run build

      - name: Construir Imagen Docker
        run: docker build -t servicio-calculos:prod-${{ github.run_number }} .

      - name: Verificacion de Despliegue (Smoke Test / Health Check)
        run: |
          docker run -d --name app-test -p 8080:80 servicio-calculos:prod-${{ github.run_number }}
          sleep 2
          curl -f -I http://localhost:8080
          docker stop app-test

      - name: Exportar Imagen Docker como Artefacto
        run: docker save servicio-calculos:prod-${{ github.run_number }} | gzip > servicio-calculos-prod-${{ github.run_number }}.tar.gz

      - name: Almacenar Artefacto en GitHub
        uses: actions/upload-artifact@v7
        with:
          name: imagen-docker-prod-${{ github.run_number }}
          path: |
            servicio-calculos-prod-${{ github.run_number }}.tar.gz
            dist/
          retention-days: 5
