# ==============================================================================
# PIPELINE CI/CD - MICROSERVICIO ms-calculos-api
# ==============================================================================

name: Pipeline CI/CD - ms-calculos-api

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  # ============================================================================
  # ETAPA 1: INTEGRACIÓN CONTINUA (CI)
  # Se ejecuta en cada Pull Request y al hacer Merge (push) a main.
  # ============================================================================
  integracion-continua:
    name: 1. CI - Pruebas Unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v7

      - name: Configurar entorno Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Ejecutar pruebas unitarias automatizadas
        run: npm test

  # ============================================================================
  # ETAPA 2: ENTREGA CONTINUA (CD) - GENERACIÓN DE ARTEFACTO
  # Depende de CI (needs) y SOLO corre tras aprobar y hacer Merge a main.
  # ============================================================================
  entrega-continua:
    name: 2. CD - Construccion y Artefacto
    needs: integracion-continua
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v7

      - name: Construir Imagen Docker versionada
        run: docker build -t ms-calculos-api:prod-${{ github.run_number }} .

      - name: Exportar Imagen Docker como Artefacto
        run: docker save ms-calculos-api:prod-${{ github.run_number }} | gzip > ms-calculos-api-prod-${{ github.run_number }}.tar.gz

      - name: Almacenar Artefacto en GitHub
        uses: actions/upload-artifact@v7
        with:
          name: ms-calculos-api-prod-${{ github.run_number }}
          path: ms-calculos-api-prod-${{ github.run_number }}.tar.gz
          retention-days: 5
